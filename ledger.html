<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e8e0cf">
    <meta name="description" content="Hedwig’s Gallery — The Travel Ledger.">
    <title>Ledger — Hedwig’s Gallery</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/styles-ledger.css">
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="ledger-page">
    <a class="skip-link" href="#frames">Skip to photographs</a>
    <header class="site-header" id="top">
      <a class="brand" href="/ledger.html">Hedwig’s Gallery</a>
      <nav aria-label="Primary navigation">
        <a href="/">Xerox</a>
        <a href="/darkroom.html">Darkroom</a>
        <a href="/folio.html">Folio</a>
        <a class="active" href="/ledger.html" aria-current="page">Ledger</a>
        <a href="/wall.html">Wall</a>
        <a href="/rolls.html">Rolls</a>
        <a href="/map.html">Map</a>
      </nav>
    </header>

    <main>
      <section class="ledger-opening" aria-labelledby="ledger-title">
        <div class="ledger-signature">
          <p>Hedwig Explains’</p>
          <h1 id="ledger-title">A travel<br>ledger.</h1>
          <span>I like to capture human emotions and quiet scenes.</span>
        </div>
        <div class="ledger-cover-photo" id="feature-strip" aria-live="polite"></div>
        <div class="route-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      </section>

      <section class="frames" id="frames" aria-labelledby="frames-title">
        <div class="frames-bar">
          <div>
            <p class="ledger-kicker">The journey</p>
            <h2 id="frames-title">All frames</h2>
            <p id="gallery-status" aria-live="polite">Loading…</p>
          </div>
          <div class="filters" aria-label="Gallery filters">
            <label><span>Year</span><select id="year-filter"><option value="all">All years</option></select></label>
            <label><span>Location</span><select id="location-filter"><option value="all">All locations</option></select></label>
            <button class="shuffle-button" id="shuffle-button" type="button"><span aria-hidden="true">↝</span> New journey</button>
          </div>
        </div>
        <div class="masonry ledger-grid" id="gallery" aria-busy="true"></div>
      </section>
    </main>

    <footer><p>Hedwig’s Travel Ledger</p><a href="#top">Top ↑</a></footer>
    <div class="float-cursor" id="float-cursor" aria-hidden="true">Open</div>

    <dialog class="viewer" id="viewer" aria-label="Photograph viewer">
      <div class="viewer-shell">
        <div class="viewer-topbar">
          <p id="viewer-position"></p>
          <div>
            <button class="icon-button" id="fullscreen-button" type="button" aria-label="Full screen" title="Full screen (F)">⛶</button>
            <button class="icon-button close-button" id="close-button" type="button" aria-label="Close viewer" title="Close (Escape)">×</button>
          </div>
        </div>
        <div class="viewer-stage" id="viewer-stage">
          <div class="viewer-loading" id="viewer-loading" aria-hidden="true"></div>
          <img id="viewer-image" alt="">
          <button class="viewer-nav viewer-prev" id="prev-button" type="button" aria-label="Previous photograph">←</button>
          <button class="viewer-nav viewer-next" id="next-button" type="button" aria-label="Next photograph">→</button>
        </div>
        <div class="viewer-meta" aria-label="Photograph metadata">
          <div><span>Frame</span><strong id="meta-frame">—</strong></div>
          <div><span>Camera</span><strong id="meta-camera">—</strong></div>
          <div><span>Lens</span><strong id="meta-lens">—</strong></div>
          <div><span>Exposure</span><strong id="meta-exposure">—</strong></div>
          <div><span>Place</span><strong id="meta-location">Not recorded</strong></div>
        </div>
      </div>
    </dialog>
    <noscript><p class="noscript">JavaScript is needed to load the gallery.</p></noscript>
  </body>
</html>
